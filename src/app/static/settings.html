<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Settings — Vocal Remover</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header>
  <h1>Model settings</h1>
  <a class="button--quiet" href="/">Back</a>
</header>

<main>
  <p class="hint">
    Pick a loaded model to adjust its inference parameters. Fields marked
    <em>restart</em> are read once at startup, so a change needs the server
    restarted before it takes effect; the rest apply to that model's next job.
  </p>

  <ul id="model-list" class="status-list"></ul>

  <form id="params-form" hidden autocomplete="off">
    <h2 id="params-heading"></h2>
    <div id="params-fields" class="field-grid"></div>
    <button id="save" type="submit">Save</button>
  </form>

  <div id="form-error" class="banner banner--error" hidden></div>
  <div id="form-ok" class="banner banner--ok" hidden></div>
</main>

<script src="/settings.js"></script>
</body>
</html>
