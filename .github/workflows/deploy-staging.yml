# Deploy to the Tailscale box.
#
# Runs on a self-hosted runner installed on the GPU machine itself, which is
# the only place this app can run: the worker preloads BS-Roformer and
# MDX-Net into VRAM at startup and aborts if they will not load.
#
# The runner polls GitHub outbound over 443, so this needs no inbound port,
# no port forward and no router configuration - the same constraint that put
# the app behind Tailscale in the first place. Tailscale is not a step here;
# it is already serving the running app, and `tailscale serve` keeps pointing
# at 127.0.0.1:8000 across restarts.
#
# One-time setup on the box:
#   1. Repo -> Settings -> Actions -> Runners -> New self-hosted runner
#      (Windows x64), in its OWN folder - a runner directory holds exactly one
#      registration, so it cannot be shared with a runner for another repo.
#   2. Configure it with the gpu label and as a service, so it survives
#      reboot. The Windows package has no svc.cmd/svc.sh (those are Linux and
#      macOS only); config.cmd installs the service itself:
#        .\config.cmd --url https://github.com/pastrainbow/Vocal-Remover #          --labels gpu --runasservice
#      Let it prompt for the service account interactively rather than
#      passing --windowslogonpassword, which would put the password in shell
#      history. Afterwards it is an ordinary Windows service:
#        Get-Service actions.runner.pastrainbow-Vocal-Remover.*
#   3. Repo -> Settings -> Environments -> New environment -> "staging"
#   4. Repo -> Settings -> Variables -> New variable:
#        STAGING_URL = https://<machine>.<tailnet>.ts.net
#
# Run the service as your own user account, not the LocalSystem default. The
# deploy needs `bash` (Git Bash) and `uv` on PATH, the Tidal token in state/
# was written by your user, and the CUDA setup is the one you tested by hand -
# all three are properties of an account, and LocalSystem shares none of them.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_ci:
        description: 'Deploy without waiting for CI (use when CI is red for unrelated reasons)'
        type: boolean
        default: false

# Never two deploys at once: they would fight over the venv, the port and the
# pid file.
#
# cancel-in-progress is true rather than false, which is the opposite of the
# usual advice for deploys. Queueing sounds safer until a run wedges - a job
# queued when no matching runner exists is never rescheduled, and
# timeout-minutes does not apply to a job that has not started - and then
# every later deploy stacks up behind it forever. That is not hypothetical;
# it is what happened on 2026-09-22 and it needed the force-cancel API to
# clear.
#
# Cancelling mid-deploy is the lesser risk here because run.sh repairs
# itself: it re-imports torch/onnxruntime/fastapi on every run and re-syncs
# when that fails, and it only stamps .installed-from AFTER a sync completes,
# so an interrupted install is detected and redone rather than trusted. The
# worst a cancelled deploy leaves behind is a stopped app, which the run that
# superseded it is about to start anyway.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate on CI rather than duplicating it. Calling ci.yml makes that a real
  # job dependency: no polling the checks API, and no race against a CI run
  # that has not registered its checks yet on the same push.
  ci:
    name: CI
    if: ${{ !inputs.skip_ci }}
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Tailscale box
    needs: [ci]
    # always() so a skipped ci job (skip_ci) does not skip the deploy with it.
    if: ${{ always() && (needs.ci.result == 'success' || inputs.skip_ci) }}
    runs-on: [self-hosted, windows, gpu]
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    timeout-minutes: 45   # a cold lockfile sync pulls ~3 GB of CUDA wheels

    steps:
      # clean: false is deliberate and load-bearing. data/models holds
      # gigabytes of gitignored checkpoints and state/ holds the Tidal OAuth
      # token; a clean checkout would re-download the models and log the box
      # out on every single deploy.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false
          # fetch-depth 0, not the default 1: the rollback step needs an older
          # commit to actually exist locally, and a depth-1 clone contains
          # exactly one. Cheap here - the repo is source only, and with
          # clean: false the fetch is incremental after the first run.
          fetch-depth: 0

      - name: Deploy
        shell: powershell
        # A hard ceiling. The job-level timeout is 45 minutes, which is the
        # right budget for a cold CUDA sync but far too long to sit on a
        # deploy that has stopped making progress.
        timeout-minutes: 20
        # VR_DATA_DIR / VR_STATE_DIR keep models, stems, the job database and
        # the Tidal token OUTSIDE the runner workspace. Without them the
        # deploy installs into _work\<repo>\<repo>, which is not the tree
        # anyone else uses: models re-download, the app starts logged out of
        # Tidal, and job history restarts from empty.
        env:
          VR_DATA_DIR: ${{ vars.VR_DATA_DIR }}
          VR_STATE_DIR: ${{ vars.VR_STATE_DIR }}
        run: ./setup/deploy.ps1

      # Same URL the phone uses. The step above already proved 127.0.0.1 is
      # healthy; this proves the path that actually matters - that Tailscale
      # is still serving it - and distinguishes "app is broken" from
      # "tailscale serve was dropped".
      - name: Verify Tailscale endpoint
        if: ${{ vars.STAGING_URL != '' }}
        shell: powershell
        run: |
          # TrimEnd because the variable may carry a trailing slash, and
          # Starlette will not match '//api/health' to the '/api/health'
          # route - it would fall through to the static mount and 404.
          $base = '${{ vars.STAGING_URL }}'.TrimEnd('/')
          try {
            $r = Invoke-RestMethod -Uri "$base/api/health" -TimeoutSec 20
          }
          catch {
            Write-Host "::error::$base is not serving: $_"
            Write-Host 'Check `tailscale serve status` on the box.'
            exit 1
          }
          if (-not $r.worker.running) {
            Write-Host '::error::endpoint answered but the worker is not running'
            exit 1
          }
          Write-Host "staging is live at $base"

      # There is deliberately NO automatic rollback step here.
      #
      # It was removed after it did more harm than the failure it was meant to
      # contain: on a failed deploy it checked out an older commit and ran
      # THAT commit's deploy.ps1 - older, differently-behaved code, chosen by
      # a heuristic - which wedged the job and could not be cancelled.
      #
      # staging-health.yml is the better safety net and already covers the
      # case: it checks every 15 minutes and runs a full repair with the
      # CURRENT code whenever staging is down. A failed deploy now leaves a
      # red run and a box that heals itself, instead of a green-ish run and a
      # box running an unknown revision.

      - name: Summary
        if: always()
        shell: powershell
        run: |
          $status = if ('${{ job.status }}' -eq 'success') { 'deployed' } else { 'FAILED' }
          @"
          ## Staging: $status

          | | |
          |---|---|
          | Commit | ``${{ github.sha }}`` |
          | URL | ${{ vars.STAGING_URL }} |
          | Runner | $env:COMPUTERNAME |
          "@ >> $env:GITHUB_STEP_SUMMARY
